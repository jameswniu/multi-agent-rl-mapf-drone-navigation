# Eight drones on the same eight wide course, and the densest board here that
# is solved: ten seeds of ten bring every drone home and keep it there, in 24
# steps against the
# best plan a central planner has found for this board, 17, with 33 refused
# moves. Seventeen is a bound and not a proven optimum: prioritised planning is
# incomplete and scripts/plan_optimum.py reports the best of 400 sampled
# orderings, so the true optimum is 17 or better. That is the safe direction for
# the comparison, since it means the policy is at least seven steps off what is
# already known to be achievable.
#
# It sat unsolved for a long time at 2 seeds of 5 and 75 percent of drones
# arriving, and the reason is worth keeping because almost every plausible
# explanation was wrong. Ruled out by measurement, in order:
#
#   feasibility     a space-time A* planner clears this exact board in 17 steps
#                   of the 60 allowed, so there was never a capacity problem
#   congestion      that 43 steps of slack says queueing was never binding, and
#                   eight drones need FEWER steps here than four do
#   wall geometry   swept 1, 2 and 3 tunnels across 2 and 3 walls; two openings
#                   is best but no setting converts it
#   goal packing    three walls leave one column, so eight goals pack it fully;
#                   widening to 50 percent cut refusals 101 to 65 and arrived
#                   no more drones
#   grid size       six drones on a ten wide board did worse, 33 to 67 percent
#   more training   flat at 2 seeds of 5 from 20000 episodes out to 60000, on
#                   five seeds, at six times the training
#   curriculum      training on four drones first and transferring the shared
#                   weights made it WORSE, 1 seed of 5 against 2; the four drone
#                   policy is a confident beeline that is wrong in a crowd and
#                   will not unlearn
#   epochs          five and ten are both worse than three
#   entropy anneal  0.10 decaying to 0.01 gives 3 of 5, worse than holding 0.06
#
# What it actually was: the drones had learned to stand still. Tracing a
# stranded drone showed it reaching (3,7), descending, and then hovering for 56
# consecutive steps while the clock ran out, with hover holding 0.83 of its
# probability against 0.17 for the move that would have freed it. The board pays
# +0.07 a step to move toward the tunnel and -0.92 a step to sit, and the drone
# sat anyway, so this was never the reward being wrong. It is an exploration
# collapse: once hover holds most of the mass, sampling stops trying anything
# else and the collapse feeds itself. The baseline burns 107 idle hovers an
# episode, which is the failure in one number.
#
# Raising the entropy weight off its 0.01 default is the whole fix, and it is
# sharply peaked rather than a direction to push in:
#
#   entropy  seeds solved  drones home  refusals
#      0.01           2/5          75%        74
#      0.03           2/5          82%       177
#      0.05           4/5          98%       129
#      0.06           5/5         100%         27
#      0.07           5/5         100%         17
#      0.08           4/5          88%       114
#      0.12           1/5          52%       280
#
# Past the peak the drones are simply noisy and start colliding with each other,
# which is what the refusal column at 0.12 is showing. Two neighbouring settings
# both solving is the reason to believe 0.06 rather than treat it as one lucky
# draw, and 0.06 was then confirmed on ten seeds of ten.
#
# 20000 episodes is the budget, and more is worse rather than merely wasteful:
# the same 0.06 run taken to 40000 falls back to 4 seeds of 5 and 92 percent.
# That matches the plateau measured on the 0.01 default, which sits flat at 2
# seeds of 5 from 20000 out to 60000.
#
# The setting is deliberately here rather than in the agent default. It is
# medicine for a crowded board and it costs accuracy on an empty one: at 0.05
# the four drone course drops to 2 seeds of 3 and takes 29 steps where the same
# board is walked in 19. Profiles that already solve keep the 0.01 default.

grid_size: 8
num_drones: 8
terrain: course
ridges: 3
max_altitude: 1
altitude_penalty: 0.5
max_steps: 60
reward_shaping: true
shaping_potential: terrain
fixed_layout: true

safety:
  geofence_margin: 0
  min_separation: 0

# Two openings in the solid wall rather than one. One genuinely jams: eight
# drones refused 106 moves across 60 steps at 20000 episodes and 179 at 50000,
# getting worse rather than better, against zero on the four drone course. Two
# fixed most of it. Three made it worse again, because extra routes are extra
# ways to conflict rather than less queueing. Two is the measured best.
#
# Three walls are kept even though they leave exactly one column for goals, so
# eight drones pack it completely against 50 percent for the four drone course.
# Widening to two walls was tried precisely because that packing looked like the
# binding constraint. It cut refusals from 101 to 65 and brought no more drones
# home, 0 seeds of 3 against 2, so the packing was a red herring and the third
# wall stays.
tunnels_per_wall: 2

# Raised off the 0.01 default because eight drones on this board collapse onto
# hovering; see the header for the measurements. Sharply peaked: 0.05 gives 4
# seeds of 5 and 0.08 gives 4 of 5, while 0.06 gives 5 of 5.
entropy_coef: 0.06
